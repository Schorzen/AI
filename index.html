<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Block Strike</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head><body>
<div id="login" class="scr"><h1>Block Strike</h1>
<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<div class="row"><button id="si">Sign in</button><button id="su">Create account</button></div>
<button id="g">Continue with Google</button><div id="autherr"></div></div>
<div id="menu" class="scr" hidden><h1>Block Strike</h1><div id="who"></div>
<button id="off">Play offline: 5v5 vs bots</button>
<div class="row"><button id="host">Host online 1v1</button><button id="join">Join online 1v1</button></div>
<input id="jid" placeholder="Paste host ID to join"><div id="hostid"></div>
<button id="so">Sign out</button>
<p>WASD move · Space jump · Mouse aim · Click fire · Right-click scope<br>1 Knife · 2 Pistol · 3 Shotgun · 4 Rifle · 5 Sniper · R reload</p></div>
<div id="pause" hidden>Click to resume</div>
<div id="hud" hidden><div id="score"></div><div id="msg"></div><div id="cross"></div><div id="hp"></div><div id="ammo"></div></div>
<div id="touch" hidden><div id="stick"><i id="knob"></i></div><div id="wpns"></div><button id="scp">Scope</button><button id="rld">Reload</button><button id="jump">Jump</button><button id="fire">Fire</button></div>
<div id="scope" hidden></div><div id="hurt"></div>
<div id="rot">Rotate your phone to landscape to play</div>
<script type="module" src="main.js"></script><script type="module" src="auth.js"></script>
</body></html>
